input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # timestamp is already set by logstash-logback-encoder as @timestamp — nothing to do
  # Promote the "level" string field to a tag so Kibana can filter on it easily
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "artacademy-logs-%{+YYYY.MM.dd}"
    # No auth needed — security is disabled in our dev ES config below
  }

  # Uncomment for debugging: prints every received event to the Logstash container stdout
  # stdout { codec => rubydebug }
}
