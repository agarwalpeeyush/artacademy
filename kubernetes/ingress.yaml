###############################################################################
# Nginx Ingress — routes for api.artacademy.local and app.artacademy.local
###############################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artacademy-ingress
  namespace: artacademy
  labels:
    app.kubernetes.io/part-of: artacademy
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.artacademy.local"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "50"
    # SSL redirect (enable when TLS is configured)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    # Backend API Gateway
    - host: api.artacademy.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
    # React Frontend
    - host: app.artacademy.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # Eureka Dashboard (optional, restrict in prod)
    - host: registry.artacademy.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: service-registry
                port:
                  number: 8761
  # Uncomment and configure for TLS termination:
  # tls:
  #   - hosts:
  #       - api.artacademy.local
  #       - app.artacademy.local
  #     secretName: artacademy-tls
