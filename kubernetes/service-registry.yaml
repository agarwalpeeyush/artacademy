###############################################################################
# Service Registry (Eureka) — Deployment + Service
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: artacademy
  labels:
    app: service-registry
    app.kubernetes.io/part-of: artacademy
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
    spec:
      containers:
        - name: service-registry
          image: artacademy/service-registry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
              name: http
          env:
            - name: SERVER_PORT
              value: "8761"
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "service-registry"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: artacademy
  labels:
    app: service-registry
spec:
  type: ClusterIP
  selector:
    app: service-registry
  ports:
    - name: http
      port: 8761
      targetPort: 8761
