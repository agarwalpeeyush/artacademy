# ============================================================================
# Art Academy Platform — Helm Values
# ============================================================================

# -- Container image settings
image:
  registry: docker.io
  # Organization prefix (images are <registry>/<organization>/<service>:<tag>)
  organization: artacademy
  tag: latest
  pullPolicy: IfNotPresent
  # pullSecrets: []

# -- Global namespace override (defaults to Helm release namespace)
namespaceOverride: ""

# ============================================================================
# Per-service replica counts and port configuration
# ============================================================================
services:
  serviceRegistry:
    name: service-registry
    replicaCount: 1
    port: 8761
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  configServer:
    name: config-server
    replicaCount: 1
    port: 8888
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  apiGateway:
    name: api-gateway
    replicaCount: 2
    port: 8080
    serviceType: LoadBalancer
    resources:
      requests:
        cpu: "300m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"

  authService:
    name: auth-service
    replicaCount: 2
    port: 8081
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    resources:
      requests:
        cpu: "250m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"

  userService:
    name: user-service
    replicaCount: 2
    port: 8082
    resources:
      requests:
        cpu: "250m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"

  courseEnrollmentService:
    name: course-enrollment-service
    replicaCount: 2
    port: 8083
    resources:
      requests:
        cpu: "250m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"

  attendanceService:
    name: attendance-service
    replicaCount: 2
    port: 8084
    resources:
      requests:
        cpu: "250m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"

  schedulingService:
    name: scheduling-service
    replicaCount: 2
    port: 8085
    resources:
      requests:
        cpu: "250m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"

  paymentService:
    name: payment-service
    replicaCount: 2
    port: 8086
    resources:
      requests:
        cpu: "250m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"

  notificationService:
    name: notification-service
    replicaCount: 2
    port: 8087
    resources:
      requests:
        cpu: "250m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "768Mi"

  reportingService:
    name: reporting-service
    replicaCount: 2
    port: 8088
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

  frontend:
    name: frontend-react
    replicaCount: 2
    port: 80
    serviceType: LoadBalancer
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

# ============================================================================
# PostgreSQL
# ============================================================================
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 10Gi
  storageClassName: ""      # leave empty for default StorageClass
  credentials:
    user: artacademy
    password: artacademy123
    database: artacademy
  databases:
    - auth_db
    - user_db
    - academic_db
    - attendance_db
    - schedule_db
    - payment_db
    - notification_db
    - reporting_db
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

# ============================================================================
# Kafka + Zookeeper
# ============================================================================
kafka:
  enabled: true
  image: confluentinc/cp-kafka:7.6.0
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
  advertisedListeners: "PLAINTEXT://kafka:9092"
  replicationFactor: 1
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

# ============================================================================
# Redis
# ============================================================================
redis:
  enabled: true
  image: redis:7-alpine
  maxMemory: 256mb
  maxMemoryPolicy: allkeys-lru
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ============================================================================
# Ingress
# ============================================================================
ingress:
  enabled: true
  className: nginx
  host: artacademy.local
  apiHost: api.artacademy.local
  appHost: app.artacademy.local
  tls:
    enabled: false
    secretName: artacademy-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

# ============================================================================
# Common Spring Boot environment variables (injected via ConfigMap)
# ============================================================================
commonEnv:
  SPRING_PROFILES_ACTIVE: kubernetes
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://service-registry:8761/eureka/"
  SPRING_CLOUD_CONFIG_URI: "http://config-server:8888"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  LOGGING_LEVEL_ROOT: "INFO"

# ============================================================================
# Pod disruption budget
# ============================================================================
podDisruptionBudget:
  enabled: false
  minAvailable: 1
