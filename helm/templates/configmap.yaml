{{/*
Art Academy — ConfigMap for shared Spring Boot environment variables
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: artacademy-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: artacademy
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
data:
  {{- range $key, $value := .Values.commonEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
