{{/*
Art Academy — Generic Deployment Template
Iterates over .Values.services and renders one Deployment per entry.
*/}}

{{- $root := . -}}
{{- range $key, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $svc.name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $root.Chart.AppVersion | quote }}
    app.kubernetes.io/part-of: artacademy
    helm.sh/chart: {{ printf "%s-%s" $root.Chart.Name $root.Chart.Version }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
        app.kubernetes.io/name: {{ $svc.name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
      annotations:
        # Force pod restart when configmap changes
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
    spec:
      {{- if not (or (eq $svc.name "service-registry") (eq $svc.name "frontend-react")) }}
      initContainers:
        - name: wait-for-registry
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q --spider http://service-registry:{{ $root.Values.services.serviceRegistry.port }}/actuator/health; do echo "Waiting for service-registry..."; sleep 5; done
        {{- if not (eq $svc.name "config-server") }}
        - name: wait-for-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q --spider http://config-server:{{ $root.Values.services.configServer.port }}/actuator/health; do echo "Waiting for config-server..."; sleep 5; done
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $svc.name }}
          image: "{{ $root.Values.image.registry }}/{{ $root.Values.image.organization }}/{{ $svc.name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: artacademy-config
          env:
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
            {{- if not (or (eq $svc.name "service-registry") (eq $svc.name "config-server") (eq $svc.name "api-gateway") (eq $svc.name "frontend-react")) }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: artacademy-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artacademy-secrets
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- if eq $svc.name "auth-service" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: artacademy-secrets
                  key: JWT_SECRET
            {{- end }}
          {{- if $svc.resources }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- end }}
          {{- if not (eq $svc.name "frontend-react") }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ $svc.port }}
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $svc.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
{{- end }}
