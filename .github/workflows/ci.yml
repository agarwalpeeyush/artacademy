###############################################################################
# Art Academy Platform — GitHub Actions CI/CD Pipeline
#
# Jobs:
#   1. build        — compile & test all Maven modules
#   2. docker-build — build & push Docker images to registry
#   3. deploy       — apply Kubernetes manifests (main branch only)
###############################################################################
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io
  IMAGE_ORG: artacademy
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

###############################################################################
# Job 1 — Build & Test (Maven)
###############################################################################
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artacademy
          POSTGRES_PASSWORD: artacademy123
          POSTGRES_DB: artacademy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artacademy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build common-library
        run: mvn -pl common-library -am clean install -DskipTests --no-transfer-progress

      - name: Build & test all services
        run: |
          mvn clean verify --no-transfer-progress \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/artacademy_test \
            -Dspring.datasource.username=artacademy \
            -Dspring.datasource.password=artacademy123
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/target/site/jacoco/"
          retention-days: 7

  ###############################################################################
  # Job 1b — Build & Test (React Frontend)
  ###############################################################################
  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-react

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend-react/build/
          retention-days: 7

  ###############################################################################
  # Job 2 — Docker Build & Push
  # Runs only on pushes (not on PRs) once the build jobs pass.
  ###############################################################################
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, build-frontend]
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: service-registry
            port: 8761
            dockerfile: docker/Dockerfile.springboot
          - name: config-server
            port: 8888
            dockerfile: docker/Dockerfile.springboot
          - name: api-gateway
            port: 8080
            dockerfile: api-gateway/Dockerfile
          - name: auth-service
            port: 8081
            dockerfile: auth-service/Dockerfile
          - name: user-service
            port: 8082
            dockerfile: docker/Dockerfile.springboot
          - name: course-enrollment-service
            port: 8083
            dockerfile: docker/Dockerfile.springboot
          - name: attendance-service
            port: 8084
            dockerfile: docker/Dockerfile.springboot
          - name: scheduling-service
            port: 8085
            dockerfile: docker/Dockerfile.springboot
          - name: payment-service
            port: 8086
            dockerfile: docker/Dockerfile.springboot
          - name: notification-service
            port: 8087
            dockerfile: docker/Dockerfile.springboot
          - name: reporting-service
            port: 8088
            dockerfile: docker/Dockerfile.springboot
          - name: frontend-react
            port: 80
            dockerfile: frontend-react/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ matrix.service.name }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ matrix.service.name }}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ matrix.service.name }}:${BRANCH}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SERVICE_NAME=${{ matrix.service.name }}
            SERVICE_PORT=${{ matrix.service.port }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          platforms: linux/amd64,linux/arm64

  ###############################################################################
  # Job 3 — Deploy to Kubernetes (main branch only)
  ###############################################################################
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Determine image tag
        id: tag
        run: echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Apply namespace
        run: kubectl apply -f kubernetes/namespace.yaml

      - name: Apply ConfigMap and Secrets
        run: |
          kubectl apply -f kubernetes/configmap.yaml
          kubectl apply -f kubernetes/secrets.yaml

      - name: Apply infrastructure (postgres, kafka, redis)
        run: |
          kubectl apply -f kubernetes/postgres.yaml
          kubectl apply -f kubernetes/kafka.yaml
          kubectl apply -f kubernetes/redis.yaml

      - name: Wait for postgres to be ready
        run: |
          kubectl rollout status statefulset/postgres -n artacademy --timeout=120s

      - name: Apply Spring Cloud core
        run: |
          kubectl apply -f kubernetes/service-registry.yaml
          kubectl rollout status deployment/service-registry -n artacademy --timeout=120s
          kubectl apply -f kubernetes/config-server.yaml
          kubectl rollout status deployment/config-server -n artacademy --timeout=120s

      - name: Apply API Gateway
        run: |
          kubectl apply -f kubernetes/api-gateway.yaml
          kubectl rollout status deployment/api-gateway -n artacademy --timeout=120s

      - name: Apply Auth Service
        run: |
          kubectl apply -f kubernetes/auth-service.yaml
          kubectl rollout status deployment/auth-service -n artacademy --timeout=120s

      - name: Apply remaining services
        run: |
          kubectl apply -f kubernetes/services.yaml
          for svc in user-service course-enrollment-service attendance-service \
                     scheduling-service payment-service notification-service reporting-service; do
            kubectl rollout status deployment/${svc} -n artacademy --timeout=120s
          done

      - name: Apply Frontend
        run: |
          kubectl apply -f kubernetes/frontend.yaml
          kubectl rollout status deployment/frontend -n artacademy --timeout=120s

      - name: Apply Ingress
        run: kubectl apply -f kubernetes/ingress.yaml

      - name: Update image tags to deployed SHA
        run: |
          SHA=${{ steps.tag.outputs.sha }}
          SERVICES="service-registry config-server api-gateway auth-service \
                    user-service course-enrollment-service attendance-service \
                    scheduling-service payment-service notification-service \
                    reporting-service"
          for svc in $SERVICES; do
            kubectl set image deployment/${svc} ${svc}=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${svc}:${SHA} \
              -n artacademy --record || true
          done
          kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/frontend-react:${SHA} \
            -n artacademy --record || true

      - name: Verify deployment health
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n artacademy
          echo "=== Services ==="
          kubectl get svc -n artacademy
          echo "=== Ingress ==="
          kubectl get ingress -n artacademy
